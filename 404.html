<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fbfaf8;
      color: #2c2e31;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .box { max-width: 420px; padding: 32px 24px; text-align: center; }
    .code {
      font-size: 64px;
      line-height: 1;
      letter-spacing: 0.04em;
      color: #e0dcd2;
      font-weight: 300;
    }
    h1 { margin: 22px 0 10px; font-size: 18px; font-weight: 600; }
    p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.8; color: #8a857c; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 18px;
      font-size: 13.5px;
      color: #1b1c1e;
      text-decoration: none;
      border: 1px solid #cfc9bb;
      border-radius: 3px;
    }
    a:hover { border-color: #7c3b2c; color: #7c3b2c; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个地址下没有内容</h1>
    <p>可能是链接写错了，或者文件还没推送到仓库。</p>
    <a href="/">回到个人档案</a>
  </div>
</body>
</html>
